<svg xmlns="http://w3.org" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background (Optional/Hidden) -->
  <rect width="100%" height="100%" fill="none"/>

  <!-- Handle -->
  <path d="M 25,85 
           C 22,88 15,85 15,80 
           C 15,70 45,35 50,40 
           Z" 
        fill="#D2B48C" 
        stroke="#5C4033" 
        stroke-width="2" 
        stroke-linejoin="round"/>
  
  <!-- Handle Grip/Detail -->
  <path d="M 20,75 C 22,72 28,78 25,81" 
        fill="none" 
        stroke="#5C4033" 
        stroke-width="1.5"/>

  <!-- Ferrule (Metal Part) -->
  <path d="M 48,38 
           L 62,52 
           L 55,59 
           L 41,45 
           Z" 
        fill="#C0C0C0" 
        stroke="#4A4A4A" 
        stroke-width="2" 
        stroke-linejoin="round"/>
  
  <!-- Ferrule Lines -->
  <line x1="45" y1="42" x2="59" y2="56" stroke="#808080" stroke-width="1"/>
  <line x1="43" y1="44" x2="57" y2="58" stroke="#4A4A4A" stroke-width="1"/>

  <!-- Bristles (Hair) -->
  <path d="M 55,59 
           C 65,69 75,70 82,62 
           C 88,55 85,45 75,35 
           C 68,28 62,52 55,59" 
        fill="#8B5A2B" 
        stroke="#3A2212" 
        stroke-width="2" 
        stroke-linejoin="round"/>

  <!-- Bristle Texture Lines -->
  <path d="M 60,56 C 65,52 72,44 76,40" fill="none" stroke="#5C4033" stroke-width="1"/>
  <path d="M 64,60 C 70,58 76,52 80,47" fill="none" stroke="#5C4033" stroke-width="1"/>
  
  <!-- Wet Paint Tip -->
  <path d="M 72,43 
           C 76,39 80,45 82,49 
           C 85,54 81,59 76,55 
           Z" 
        fill="#0074D9"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Wood Handle -->
  <path d="M 22,78 C 18,82 12,76 16,72 L 42,46 L 52,56 Z" fill="#D2B48C" stroke="#5C4033" stroke-width="2.5" stroke-linejoin="miter"/>
  
  <!-- Silver Metal Ferrule (Connects exactly to handle at 42,46 and 52,56) -->
  <path d="M 42,46 L 56,32 L 66,42 L 52,56 Z" fill="#C0C0C0" stroke="#4A4A4A" stroke-width="2.5" stroke-linejoin="miter"/>
  <line x1="47" y1="41" x2="57" y2="51" stroke="#808080" stroke-width="1.5"/>
  <line x1="51" y1="37" x2="61" y2="47" stroke="#4A4A4A" stroke-width="1.5"/>

  <!-- Dark Bristles (Connects exactly to metal at 56,32 and 66,42) -->
  <path d="M 56,32 C 62,20 72,16 84,24 C 88,28 82,38 66,42 Z" fill="#8B5A2B" stroke="#3A2212" stroke-width="2.5" stroke-linejoin="miter"/>
  
  <!-- Bristle Detail Lines -->
  <path d="M 60,34 C 66,28 72,25 78,26" fill="none" stroke="#5C4033" stroke-width="1"/>
  <path d="M 63,39 C 69,34 74,31 80,30" fill="none" stroke="#5C4033" stroke-width="1"/>

  <!-- Blue Paint Tip -->
  <path d="M 72,22 C 78,18 84,24 82,28 C 76,33 70,27 72,22 Z" fill="#0074D9"/>
</svg>
